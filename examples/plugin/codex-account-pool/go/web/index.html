<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Account Pool</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-alt: #f8fafb;
      --line: #d7dde3;
      --line-strong: #aeb8c2;
      --text: #17212b;
      --muted: #64717d;
      --teal: #0b7189;
      --teal-soft: #e4f3f6;
      --blue: #315ca8;
      --blue-soft: #e8f0ff;
      --green: #18794e;
      --green-soft: #e7f6ed;
      --amber: #8b5b00;
      --amber-soft: #fff3d8;
      --red: #b42318;
      --red-soft: #fdecec;
      --shadow: 0 1px 2px rgba(17, 24, 39, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled, input:disabled, select:disabled { cursor: not-allowed; opacity: .52; }
    h1, h2, h3, p { margin-top: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
      backdrop-filter: blur(8px);
    }
    .topbar-inner {
      max-width: 1500px;
      min-height: 58px;
      margin: auto;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 { margin: 0 10px 0 0; font-size: 17px; line-height: 1.2; }
    h2 { margin-bottom: 10px; font-size: 15px; }
    h3 { margin-bottom: 8px; font-size: 13px; color: #435160; }
    .status { color: var(--muted); font-size: 12px; }
    .success { color: var(--green); }
    .error { color: var(--red); }
    .spacer { flex: 1; }
    .button, .control {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
    }
    .button { padding: 0 12px; font-weight: 650; }
    .button:hover:not(:disabled) { border-color: var(--line-strong); }
    .button.primary { border-color: var(--teal); background: var(--teal); color: #fff; }
    .button.danger { color: var(--red); }
    .control { padding: 0 10px; }
    .control:focus, .number-input:focus {
      outline: 2px solid #b7dce7;
      outline-offset: 1px;
      border-color: var(--teal);
    }
    main { max-width: 1500px; margin: auto; padding: 14px 18px 34px; }
    .mode-bar {
      margin-bottom: 12px;
      padding: 10px 0 11px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }
    .mode-label { color: #435160; font-size: 12px; font-weight: 750; }
    .segments {
      display: inline-flex;
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }
    .segments button {
      min-width: max-content;
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }
    .segments button:last-child { border-right: 0; }
    .segments button.active { background: var(--teal-soft); color: var(--teal); font-weight: 750; }
    .profile-line {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 22px;
      color: var(--muted);
      font-size: 12px;
    }
    .profile-line strong { color: #435160; }
    .notice {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-left: 3px solid var(--amber);
      background: var(--amber-soft);
      color: #6f4800;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .toolbar .control { min-width: 160px; }
    .summary { margin-left: auto; color: var(--muted); font-size: 12px; }
    .batch {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding: 9px 11px;
      border: 1px solid #a9cbd6;
      border-radius: 6px;
      background: #eff8fa;
    }
    .batch.visible { display: flex; }
    .batch strong { color: var(--teal); }
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .account-table { min-width: 1470px; }
    .decision-table { min-width: 900px; }
    .preview-table { min-width: 940px; }
    th, td {
      padding: 8px 7px;
      border-bottom: 1px solid #e7ebef;
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface-alt);
      color: #4b5967;
      font-size: 12px;
      font-weight: 750;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafcfd; }
    tbody tr.changed { background: #fff9e8; }
    tbody tr.active-group { background: #eef8f4; }
    .check { width: 38px; text-align: center; }
    .account { width: 245px; }
    .plan { width: 88px; }
    .quota { width: 110px; }
    .usage { width: 250px; }
    .state { width: 108px; }
    .number { width: 90px; }
    .toggle { width: 72px; text-align: center; }
    .account-name { overflow: hidden; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .account-sub, .cell-sub {
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .usage-total { font-weight: 700; white-space: nowrap; }
    .usage-detail {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
      white-space: normal;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #edf1f4;
      color: #4c5b68;
      font-size: 11px;
      font-weight: 750;
    }
    .pill.free, .pill.ready, .pill.group { background: var(--green-soft); color: var(--green); }
    .pill.paid, .pill.layer { background: var(--blue-soft); color: var(--blue); }
    .pill.backup, .pill.waiting { background: var(--amber-soft); color: var(--amber); }
    .pill.refreshing { background: var(--teal-soft); color: var(--teal); }
    .pill.failed, .pill.excluded { background: var(--red-soft); color: var(--red); }
    .meter { height: 5px; margin-top: 4px; overflow: hidden; border-radius: 5px; background: #e7ebef; }
    .meter span { display: block; height: 100%; background: var(--green); }
    .meter.warn span { background: #b77b00; }
    .meter.bad span { background: var(--red); }
    .number-input {
      width: 72px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
    }
    .switch {
      width: 36px;
      height: 20px;
      padding: 2px;
      border: 0;
      border-radius: 999px;
      background: #bec7d0;
      vertical-align: middle;
    }
    .switch span {
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s;
    }
    .switch.on { background: var(--teal); }
    .switch.on span { transform: translateX(16px); }
    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 9px;
    }
    .section-head h2 { margin: 0; }
    .section-head .status { margin-left: auto; }
    .empty { padding: 34px; color: var(--muted); text-align: center; }
    .hidden { display: none !important; }
    dialog {
      width: min(1120px, calc(100% - 24px));
      max-width: none;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: 0 20px 60px rgba(17, 24, 39, .24);
    }
    dialog::backdrop { background: rgba(17, 24, 39, .38); }
    .key-dialog { width: min(440px, calc(100% - 24px)); }
    .dialog-body { padding: 16px 18px; }
    .dialog-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .dialog-title h2 { margin: 0; font-size: 17px; }
    .dialog-title .spacer { min-width: 10px; }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 11px 18px;
      border-top: 1px solid var(--line);
    }
    .key-row { display: flex; gap: 8px; }
    .key-row input { flex: 1; }
    .preview-summary {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr);
      gap: 16px;
      padding: 10px 0 14px;
      border-bottom: 1px solid var(--line);
    }
    .selected-account { min-height: 46px; }
    .selected-account strong { display: block; margin-bottom: 4px; font-size: 16px; }
    .funnel {
      display: grid;
      grid-template-columns: repeat(6, minmax(92px, 1fr));
      margin: 14px 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }
    .funnel-step {
      min-width: 0;
      padding: 9px 10px;
      border-right: 1px solid var(--line);
    }
    .funnel-step:last-child { border-right: 0; }
    .funnel-step span { display: block; color: var(--muted); font-size: 11px; }
    .funnel-step strong { display: block; margin-top: 3px; font-size: 18px; }
    .exclusions { display: flex; gap: 7px; flex-wrap: wrap; min-height: 26px; }
    .exclusion-item {
      padding: 4px 7px;
      border: 1px solid #efc3bf;
      border-radius: 5px;
      background: #fff7f6;
      color: #7e271f;
      font-size: 12px;
    }
    .preview-table-wrap { max-height: 360px; margin-top: 10px; }
    @media (max-width: 920px) {
      .funnel { grid-template-columns: repeat(3, 1fr); }
      .funnel-step:nth-child(3) { border-right: 0; }
      .funnel-step:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
      .preview-summary { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .topbar { position: static; }
      .topbar-inner, main { padding-left: 10px; padding-right: 10px; }
      h1 { width: 100%; }
      .spacer { display: none; }
      .toolbar .control, .batch .control { flex: 1; min-width: 128px; }
      .summary { width: 100%; margin-left: 0; }
      .mode-bar { align-items: stretch; }
      .mode-label { width: 100%; }
      .segments { width: 100%; }
      .profile-line { display: grid; grid-template-columns: 1fr; gap: 6px; }
      .profile-line strong, .profile-line span { width: 100%; }
      .funnel { grid-template-columns: repeat(2, 1fr); }
      .funnel-step { border-bottom: 1px solid var(--line); }
      .funnel-step:nth-child(2n) { border-right: 0; }
      .funnel-step:nth-last-child(-n+2) { border-bottom: 0; }
      .dialog-title { align-items: stretch; flex-wrap: wrap; }
      .dialog-title .control { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Codex Account Pool</h1>
      <span id="connectionStatus" class="status" role="status" aria-live="polite">未连接</span>
      <div class="spacer"></div>
      <button class="button" id="reloadButton">重新加载</button>
      <button class="button" id="previewButton">调度预览</button>
      <button class="button" id="refreshButton">刷新额度</button>
      <button class="button primary" id="applyButton" disabled>应用更改</button>
    </div>
  </header>

  <main>
    <section class="mode-bar">
      <span class="mode-label">自动调度</span>
      <div class="segments" id="automaticProfileSegments" aria-label="自动路由模式">
        <button data-profile="auto">自动</button>
        <button data-profile="quota-high-first">高额度</button>
        <button data-profile="quota-low-first">低额度</button>
        <button data-profile="plan-high-first">高订阅</button>
        <button data-profile="plan-low-first">低订阅</button>
      </div>
      <span class="mode-label">严格调度</span>
      <div class="segments" id="strictProfileSegments" aria-label="严格路由模式">
        <button data-profile="paid-first">付费优先</button>
        <button data-profile="free-first">Free 优先</button>
        <button data-profile="free-only">仅 Free</button>
        <button data-profile="custom">自定义</button>
      </div>
      <select class="control" id="profileDuration" aria-label="模式持续时间">
        <option value="0">永久</option>
        <option value="60">1 小时</option>
        <option value="360">6 小时</option>
      </select>
      <select class="control" id="customPlanOrder" aria-label="自定义套餐顺序">
        <option value="paid,free,unknown">付费 → Free → 未知</option>
        <option value="free,paid,unknown">Free → 付费 → 未知</option>
        <option value="paid,unknown,free">付费 → 未知 → Free</option>
        <option value="free,unknown,paid">Free → 未知 → 付费</option>
        <option value="unknown,paid,free">未知 → 付费 → Free</option>
        <option value="unknown,free,paid">未知 → Free → 付费</option>
      </select>
      <button class="button hidden" id="clearTemporaryButton">清除临时模式</button>
      <div class="profile-line">
        <strong id="profileStatus"></strong>
        <span id="profileRule"></span>
        <span class="notice hidden" id="manualRoutingNotice">当前为自动模式，已保存的优先级和权重不会参与调度。</span>
      </div>
    </section>

    <section class="toolbar">
      <input class="control" id="searchInput" type="search" placeholder="搜索账号">
      <select class="control" id="planFilter">
        <option value="">全部套餐</option>
        <option value="free">Free</option>
        <option value="paid">付费</option>
        <option value="unknown">未知</option>
      </select>
      <select class="control" id="stateFilter">
        <option value="">全部状态</option>
        <option value="ready">可用</option>
        <option value="disabled">已停用</option>
        <option value="backup">备用</option>
        <option value="stale">额度过期</option>
      </select>
      <button class="button" id="selectFreeButton">选择全部 Free</button>
      <button class="button" id="selectPaidButton">选择全部付费</button>
      <span class="summary" id="summary"></span>
    </section>

    <section class="batch" id="batchBar">
      <strong id="selectedCount">已选择 0 个</strong>
      <input class="control manual-routing-control" id="batchPriority" type="number" placeholder="优先级">
      <input class="control manual-routing-control" id="batchWeight" type="number" min="1" placeholder="权重">
      <select class="control" id="batchBackup">
        <option value="">备用不变</option>
        <option value="false">设为普通</option>
        <option value="true">设为备用</option>
      </select>
      <select class="control" id="batchEnabled">
        <option value="">启用不变</option>
        <option value="true">启用</option>
        <option value="false">停用</option>
      </select>
      <input class="control" id="batchFiveHourReserve" type="number" min="0" max="100" placeholder="5h 保留">
      <input class="control" id="batchWeeklyReserve" type="number" min="0" max="100" placeholder="周保留">
      <button class="button" id="applyBatchButton">应用到所选</button>
      <button class="button" id="refreshSelectedButton">刷新所选</button>
    </section>

    <div class="table-wrap">
      <table class="account-table">
        <thead>
          <tr>
            <th class="check"><input id="selectAll" type="checkbox" aria-label="全选"></th>
            <th class="account">账号</th>
            <th class="plan">套餐</th>
            <th class="quota">5 小时</th>
            <th class="quota">周额度</th>
            <th class="usage">Token 用量</th>
            <th class="state">状态</th>
            <th class="number">优先级</th>
            <th class="number">权重</th>
            <th class="toggle">备用</th>
            <th class="toggle">启用</th>
            <th class="number">5h 保留</th>
            <th class="number">周保留</th>
          </tr>
        </thead>
        <tbody id="accountRows">
          <tr><td colspan="13" class="empty">输入管理密钥后加载账号</td></tr>
        </tbody>
      </table>
    </div>

    <section class="section-head">
      <h2>最近真实调度</h2>
      <span class="status" id="decisionStatus">尚未加载</span>
    </section>
    <div class="table-wrap">
      <table class="decision-table">
        <thead>
          <tr>
            <th style="width:180px">时间</th>
            <th style="width:180px">账号</th>
            <th style="width:150px">模型</th>
            <th style="width:140px">模式</th>
            <th style="width:90px">层级</th>
            <th style="width:180px">候选 → 可用 → 最终组</th>
          </tr>
        </thead>
        <tbody id="decisionRows">
          <tr><td colspan="6" class="empty">暂无真实调度记录</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <dialog class="key-dialog" id="keyDialog">
    <form method="dialog">
      <div class="dialog-body">
        <div class="dialog-title"><h2>连接管理接口</h2></div>
        <div class="key-row">
          <input class="control" id="keyInput" type="password" autocomplete="current-password" placeholder="Management Key">
        </div>
      </div>
      <div class="dialog-actions">
        <button class="button primary" id="connectButton" value="default">连接</button>
      </div>
    </form>
  </dialog>

  <dialog id="previewDialog">
    <div class="dialog-body">
      <div class="dialog-title">
        <h2>调度预览</h2>
        <div class="spacer"></div>
        <input class="control" id="previewModel" placeholder="模型，可留空">
        <button class="button primary" id="runPreviewButton">运行预览</button>
        <button class="button" id="closePreviewButton">关闭</button>
      </div>
      <div class="status" id="previewStatus">等待预览</div>
      <div class="preview-summary">
        <section>
          <h3>预计选择</h3>
          <div class="selected-account" id="previewSelected">尚未运行</div>
        </section>
        <section>
          <h3>当前规则</h3>
          <div id="previewRule" class="status"></div>
        </section>
      </div>
      <div class="funnel" id="previewFunnel"></div>
      <section>
        <h3>排除原因</h3>
        <div class="exclusions" id="previewExclusions"><span class="status">尚未运行</span></div>
      </section>
      <div class="table-wrap preview-table-wrap">
        <table class="preview-table">
          <thead>
            <tr>
              <th style="width:210px">账号</th>
              <th style="width:110px">层级</th>
              <th style="width:135px">订阅排序</th>
              <th style="width:110px">额度分数</th>
              <th style="width:120px">手工参数</th>
              <th style="width:210px">结果</th>
            </tr>
          </thead>
          <tbody id="previewCandidates">
            <tr><td colspan="6" class="empty">尚未运行预览</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </dialog>

  <script>
    const apiBase = "/v0/management/codex-account-pool";
    const automaticProfiles = new Set(["auto", "quota-high-first", "quota-low-first", "plan-high-first", "plan-low-first"]);
    const profileRules = {
      "auto": "先选订阅等级最高的账号，再比较最低剩余额度；完整相同时等权轮换。",
      "quota-high-first": "先选最低剩余额度最高的账号，再比较订阅等级。",
      "quota-low-first": "先选仍高于保留线且最低剩余额度最低的账号，再比较订阅等级。",
      "plan-high-first": "先选订阅等级最高的账号，再比较最低剩余额度。",
      "plan-low-first": "先选订阅等级最低的账号，再比较最低剩余额度。",
      "paid-first": "付费层优先；层内取最高优先级，再按权重平滑轮询。",
      "free-first": "Free 层优先；层内取最高优先级，再按权重平滑轮询。",
      "free-only": "只使用 Free 普通账号；普通层耗尽后才使用显式备用账号。",
      "custom": "按自定义套餐顺序分层；层内取最高优先级，再按权重平滑轮询。"
    };
    const profileLabels = {
      "auto": "自动",
      "quota-high-first": "高额度",
      "quota-low-first": "低额度",
      "plan-high-first": "高订阅",
      "plan-low-first": "低订阅",
      "paid-first": "付费优先",
      "free-first": "Free 优先",
      "free-only": "仅 Free",
      "custom": "自定义"
    };
    const reasonLabels = {
      "plugin_disabled": "插件策略已停用",
      "host_disabled": "宿主已停用",
      "host_unavailable": "宿主标记不可用",
      "host_error": "宿主账号异常",
      "quota_stale": "额度数据过期",
      "five_hour_reserve": "低于 5 小时保留线",
      "weekly_reserve": "低于周额度保留线",
      "profile_excluded": "不属于当前严格模式"
    };

    let managementKey = sessionStorage.getItem("codexPoolKey") || "";
    let accounts = [];
    let decisions = [];
    let pending = new Map();
    let selected = new Set();
    let currentProfile = "";
    let refreshPollGeneration = 0;
    let refreshRequestGeneration = 0;
    let latestSuccessfulRefreshRequest = 0;
    let accountRequestSequence = 0;
    let latestSuccessfulAccountRequest = 0;
    let loadSequence = 0;
    let activeRefreshPollGeneration = 0;
    let accountPollTimer = 0;
    let refreshPollTimer = 0;

    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    })[character]);

    async function api(path, options = {}) {
      const headers = {
        "X-Management-Key": managementKey,
        "Content-Type": "application/json",
        ...(options.headers || {})
      };
      const response = await fetch(apiBase + path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.message || data.error || `HTTP ${response.status}`);
      }
      return data;
    }

    function policyFor(account) {
      return { ...account.policy, ...(pending.get(account.id) || {}) };
    }

    function shortTime(value) {
      if (!value) return "";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
    }

    function formatTokens(value) {
      const amount = Math.max(0, Number(value) || 0);
      for (const [divisor, suffix] of [[1e9, "B"], [1e6, "M"], [1e3, "K"]]) {
        if (amount >= divisor) {
          return `${(amount / divisor).toFixed(2).replace(/\.?0+$/, "")}${suffix}`;
        }
      }
      return String(Math.trunc(amount));
    }

    function exactTokens(value) {
      return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 })
        .format(Math.max(0, Number(value) || 0));
    }

    function usageCell(usage) {
      if (!usage) return '<span class="status">--</span>';
      const updated = shortTime(usage.updated_at) || "--";
      const details = [
        "代理累计用量（仅本 CLIProxyAPI 实例）",
        `总量：${exactTokens(usage.total_tokens)}`,
        `输入：${exactTokens(usage.input_tokens)}`,
        `输出：${exactTokens(usage.output_tokens)}`,
        `推理：${exactTokens(usage.reasoning_tokens)}`,
        `缓存：${exactTokens(usage.cache_tokens)}`,
        `请求：${exactTokens(usage.requests)}`,
        `失败：${exactTokens(usage.failed_requests)}`,
        `更新：${updated}`
      ].join("\n");
      return `
        <div tabindex="0" title="${escapeHTML(details)}" aria-label="${escapeHTML(details)}">
          <div class="usage-total">代理累计 · 总量 ${formatTokens(usage.total_tokens)}</div>
          <div class="usage-detail">输入 ${formatTokens(usage.input_tokens)} · 输出 ${formatTokens(usage.output_tokens)} · 推理 ${formatTokens(usage.reasoning_tokens)} · 缓存 ${formatTokens(usage.cache_tokens)}</div>
        </div>`;
    }

    function quotaCell(value, present) {
      if (!present) return '<span class="status">--</span>';
      const amount = Number(value || 0);
      const className = amount <= 10 ? "bad" : amount <= 30 ? "warn" : "";
      return `<strong>${amount}%</strong><div class="meter ${className}"><span style="width:${amount}%"></span></div>`;
    }

    function filtered() {
      const query = $("searchInput").value.trim().toLowerCase();
      const plan = $("planFilter").value;
      const state = $("stateFilter").value;
      return accounts.filter(account => {
        const policy = policyFor(account);
        if (query && !`${account.label || ""} ${account.email || ""} ${account.id}`.toLowerCase().includes(query)) return false;
        if (plan && account.plan !== plan) return false;
        if (state === "backup" && !policy.backup) return false;
        if (state === "disabled" && policy.enabled && !account.host_disabled) return false;
        if (state === "stale" && account.quota_fresh) return false;
        if (state === "ready" && (!policy.enabled || account.host_disabled || account.host_unavailable || !account.quota_fresh)) return false;
        return true;
      });
    }

    function accountEditIsFocused() {
      const activeElement = document.activeElement;
      return Boolean(activeElement &&
        typeof activeElement.matches === "function" &&
        activeElement.matches("#accountRows input[data-field]"));
    }

    function renderAccounts(preserveFocusedEdit = false) {
      const rows = filtered();
      const automatic = automaticProfiles.has(currentProfile);
      $("summary").textContent = `显示 ${rows.length} / ${accounts.length} 个账号`;
      updateBatch();
      if (preserveFocusedEdit && accountEditIsFocused()) return false;
      if (!rows.length) {
        $("accountRows").innerHTML = '<tr><td colspan="13" class="empty">没有符合条件的账号</td></tr>';
        return true;
      }
      $("accountRows").innerHTML = rows.map(account => {
        const policy = policyFor(account);
        const refresh = account.refresh || {};
        const refreshing = refresh.state === "queued" || refresh.state === "refreshing";
        const failed = refresh.state === "failed";
        const status = !policy.enabled || account.host_disabled ? "已停用"
          : account.host_unavailable ? "不可用"
          : refreshing ? (refresh.state === "queued" ? "等待刷新" : "刷新中")
          : failed ? "刷新失败"
          : policy.backup ? "备用"
          : !account.quota_fresh ? "额度过期"
          : "可用";
        const statusClass = refreshing ? "refreshing" : failed ? "failed" : policy.backup ? "backup" : "ready";
        const nextRefresh = shortTime(refresh.next_refresh);
        const detail = failed ? (refresh.last_error || "刷新失败") : nextRefresh ? `下次 ${nextRefresh}` : "";
        return `
          <tr class="${pending.has(account.id) ? "changed" : ""}" data-id="${escapeHTML(account.id)}">
            <td class="check"><input type="checkbox" data-select="${escapeHTML(account.id)}" ${selected.has(account.id) ? "checked" : ""}></td>
            <td class="account">
              <div class="account-name">${escapeHTML(account.label || account.email || account.id)}</div>
              <div class="account-sub">${escapeHTML(account.email || account.id)}</div>
            </td>
            <td><span class="pill ${escapeHTML(account.plan)}">${escapeHTML(account.plan_type || account.plan)}</span></td>
            <td>${quotaCell(account.five_hour_remaining, account.five_hour_window_present)}</td>
            <td>${quotaCell(account.weekly_remaining, account.weekly_window_present)}</td>
            <td class="usage">${usageCell(account.usage)}</td>
            <td>
              <span class="pill ${statusClass}">${status}</span>
              ${detail ? `<div class="cell-sub" title="${escapeHTML(detail)}">${escapeHTML(detail)}</div>` : ""}
            </td>
            <td><input class="number-input" type="number" data-field="priority" value="${policy.priority}" ${automatic ? "disabled" : ""}></td>
            <td><input class="number-input" type="number" min="1" data-field="weight" value="${policy.weight}" ${automatic ? "disabled" : ""}></td>
            <td class="toggle"><button class="switch ${policy.backup ? "on" : ""}" data-toggle="backup" aria-label="备用"><span></span></button></td>
            <td class="toggle"><button class="switch ${policy.enabled ? "on" : ""}" data-toggle="enabled" aria-label="启用"><span></span></button></td>
            <td><input class="number-input" type="number" min="0" max="100" data-field="five_hour_reserve" value="${policy.five_hour_reserve}"></td>
            <td><input class="number-input" type="number" min="0" max="100" data-field="weekly_reserve" value="${policy.weekly_reserve}"></td>
          </tr>`;
      }).join("");
      bindRows();
      updateBatch();
      return true;
    }

    function bindRows() {
      document.querySelectorAll("#accountRows tr[data-id]").forEach(row => {
        const id = row.dataset.id;
        row.querySelector("[data-select]").onchange = event => {
          event.target.checked ? selected.add(id) : selected.delete(id);
          updateBatch();
        };
        row.querySelectorAll("[data-field]").forEach(input => {
          let finished = false;
          const finish = () => {
            if (finished) return;
            finished = true;
            renderAccounts();
          };
          input.oninput = () => {
            stageEdit(id, input.dataset.field, Number(input.value), row);
          };
          input.onchange = finish;
          input.onblur = finish;
        });
        row.querySelectorAll("[data-toggle]").forEach(button => {
          button.onclick = () => {
            const account = accounts.find(item => item.id === id);
            edit(id, button.dataset.toggle, !policyFor(account)[button.dataset.toggle]);
          };
        });
      });
    }

    function stageEdit(id, field, value, row = null) {
      pending.set(id, { ...(pending.get(id) || {}), [field]: value });
      $("applyButton").disabled = false;
      if (row) row.classList.add("changed");
    }

    function edit(id, field, value) {
      stageEdit(id, field, value);
      renderAccounts();
    }

    function updateBatch() {
      $("selectedCount").textContent = `已选择 ${selected.size} 个`;
      $("batchBar").classList.toggle("visible", selected.size > 0);
      const automatic = automaticProfiles.has(currentProfile);
      $("batchPriority").disabled = automatic;
      $("batchWeight").disabled = automatic;
    }

    function updateProfile(profileData) {
      currentProfile = profileData.effective;
      document.querySelectorAll("[data-profile]").forEach(button => {
        button.classList.toggle("active", button.dataset.profile === currentProfile);
      });
      const customOrder = (profileData.custom_plan_order || []).join(",");
      if (customOrder) $("customPlanOrder").value = customOrder;
      $("customPlanOrder").disabled = currentProfile !== "custom";
      const temporary = profileData.temporary;
      const expires = temporary && shortTime(temporary.expires_at);
      $("profileStatus").textContent = temporary && expires
        ? `${profileLabels[currentProfile] || currentProfile}，临时至 ${expires}`
        : `${profileLabels[profileData.persistent] || profileData.persistent}，长期`;
      $("profileRule").textContent = profileRules[currentProfile] || "";
      $("clearTemporaryButton").classList.toggle("hidden", !temporary);
      $("manualRoutingNotice").classList.toggle("hidden", !automaticProfiles.has(currentProfile));
    }

    function renderDecisions() {
      $("decisionStatus").textContent = decisions.length ? `保留最近 ${decisions.length} 条` : "尚无真实请求";
      if (!decisions.length) {
        $("decisionRows").innerHTML = '<tr><td colspan="6" class="empty">暂无真实调度记录</td></tr>';
        return;
      }
      $("decisionRows").innerHTML = decisions.map(decision => {
        const account = accounts.find(item => item.id === decision.auth_id);
        const accountName = account ? (account.label || account.email || account.id) : decision.auth_id;
        return `
          <tr>
            <td>${escapeHTML(shortTime(decision.timestamp))}</td>
            <td><div class="account-name">${escapeHTML(accountName)}</div><div class="account-sub">${escapeHTML(decision.auth_id)}</div></td>
            <td>${escapeHTML(decision.model || "--")}</td>
            <td><span class="pill ${automaticProfiles.has(decision.profile) ? "refreshing" : "layer"}">${escapeHTML(profileLabels[decision.profile] || decision.profile)}</span></td>
            <td><span class="pill ${decision.layer === "backup" ? "backup" : "ready"}">${decision.layer === "backup" ? "备用" : "普通"}</span></td>
            <td>${Number(decision.candidate_count || 0)} → ${Number(decision.eligible_count || 0)} → ${Number(decision.group_size || 0)}</td>
          </tr>`;
      }).join("");
    }

    function setConnectionStatus(message, className = "") {
      $("connectionStatus").textContent = message;
      $("connectionStatus").className = `status${className ? ` ${className}` : ""}`;
    }

    function startAccountRequest(generation = null) {
      return {
        sequence: ++accountRequestSequence,
        generation,
        response: api("/accounts").then(
          accountData => ({ accountData, error: null }),
          error => ({ accountData: null, error })
        )
      };
    }

    function accountRequestIsCurrent(request) {
      return request.sequence === accountRequestSequence &&
        (request.generation === null || request.generation === refreshPollGeneration);
    }

    function applyAccountsResponse(request, accountData) {
      if (!accountRequestIsCurrent(request)) return false;
      accounts = accountData.accounts || [];
      return true;
    }

    function loadIsCurrent(sequence, generation) {
      return sequence === loadSequence &&
        (generation === null || generation === refreshPollGeneration);
    }

    async function load(generation = null) {
      const sequence = ++loadSequence;
      let accountRequest = null;
      try {
        accountRequest = startAccountRequest(generation);
        const [accountResult, profileData, decisionData] = await Promise.all([
          accountRequest.response,
          api("/profile"),
          api("/decisions")
        ]);
        if (!loadIsCurrent(sequence, generation)) return false;
        const accountRequestCurrent = accountRequestIsCurrent(accountRequest);
        if (accountResult.error && accountRequestCurrent) throw accountResult.error;
        const accountsUpdated = !accountResult.error &&
          applyAccountsResponse(accountRequest, accountResult.accountData);
        decisions = decisionData.decisions || [];
        updateProfile(profileData);
        renderAccounts();
        renderDecisions();
        if (accountsUpdated) {
          latestSuccessfulAccountRequest = accountRequest.sequence;
          setConnectionStatus("已连接", "success");
        }
        scheduleAccountPolling();
        return true;
      } catch (error) {
        if (!loadIsCurrent(sequence, generation)) return false;
        if (accountRequest && accountRequest.sequence < latestSuccessfulAccountRequest) {
          error.preserveConnectionStatus = true;
        }
        showError(error);
        throw error;
      }
    }

    async function refreshAccountsResult(generation = null) {
      if (document.hidden || !managementKey) return { applied: false, reason: "inactive" };
      const accountRequest = startAccountRequest(generation);
      const accountResult = await accountRequest.response;
      if (document.hidden) return { applied: false, reason: "hidden" };
      if (!accountRequestIsCurrent(accountRequest)) {
        const superseded = accountRequest.sequence !== accountRequestSequence &&
          accountRequest.generation !== null &&
          accountRequest.generation === refreshPollGeneration &&
          accountRequest.generation === activeRefreshPollGeneration;
        if (superseded) return { applied: false, reason: "superseded" };
        return { applied: false, reason: "stale" };
      }
      if (accountResult.error) {
        setConnectionStatus(accountResult.error.message, "error");
        return { applied: false, reason: "failed" };
      }
      if (!applyAccountsResponse(accountRequest, accountResult.accountData)) {
        return { applied: false, reason: "stale" };
      }
      renderAccounts(true);
      latestSuccessfulAccountRequest = accountRequest.sequence;
      setConnectionStatus("已连接", "success");
      return { applied: true, reason: "applied" };
    }

    async function refreshAccounts(generation = null) {
      const result = await refreshAccountsResult(generation);
      return result.applied;
    }

    function finishRefreshPolling(generation) {
      if (activeRefreshPollGeneration !== generation) return false;
      clearTimeout(refreshPollTimer);
      refreshPollTimer = 0;
      activeRefreshPollGeneration = 0;
      scheduleAccountPolling();
      return true;
    }

    function scheduleRefreshPolling(generation, attempt) {
      clearTimeout(refreshPollTimer);
      refreshPollTimer = setTimeout(() => {
        refreshPollTimer = 0;
        return pollRefreshStatus(generation, attempt + 1).catch(error => {
          finishRefreshPolling(generation);
          showError(error);
        });
      }, 2000);
    }

    function scheduleAccountPolling() {
      clearTimeout(accountPollTimer);
      accountPollTimer = 0;
      if (document.hidden || !managementKey || activeRefreshPollGeneration !== 0) return;
      accountPollTimer = setTimeout(async () => {
        accountPollTimer = 0;
        try {
          await refreshAccounts();
        } catch (error) {
          showError(error);
        } finally {
          scheduleAccountPolling();
        }
      }, 5000);
    }

    async function applyPending() {
      if (!pending.size) return;
      const updates = [...pending].map(([id, set]) => ({ id, set }));
      await api("/accounts", { method: "PATCH", body: JSON.stringify({ updates }) });
      pending.clear();
      $("applyButton").disabled = true;
      await load();
    }

    function batchPatch() {
      const set = {};
      if (!automaticProfiles.has(currentProfile) && $("batchPriority").value !== "") set.priority = Number($("batchPriority").value);
      if (!automaticProfiles.has(currentProfile) && $("batchWeight").value !== "") set.weight = Number($("batchWeight").value);
      if ($("batchBackup").value !== "") set.backup = $("batchBackup").value === "true";
      if ($("batchEnabled").value !== "") set.enabled = $("batchEnabled").value === "true";
      if ($("batchFiveHourReserve").value !== "") set.five_hour_reserve = Number($("batchFiveHourReserve").value);
      if ($("batchWeeklyReserve").value !== "") set.weekly_reserve = Number($("batchWeeklyReserve").value);
      if (!Object.keys(set).length) return;
      for (const id of selected) {
        pending.set(id, { ...(pending.get(id) || {}), ...set });
      }
      $("applyButton").disabled = pending.size === 0;
      renderAccounts();
    }

    async function setProfile(profile) {
      const duration = Number($("profileDuration").value || 0);
      const customPlanOrder = $("customPlanOrder").value.split(",");
      await api("/profile", {
        method: "PUT",
        body: JSON.stringify({ profile, duration_minutes: duration, custom_plan_order: customPlanOrder })
      });
      await load();
    }

    async function saveCustomPlanOrder() {
      const customPlanOrder = $("customPlanOrder").value.split(",").map(value => value.trim()).filter(Boolean);
      await api("/profile", {
        method: "PUT",
        body: JSON.stringify({ custom_plan_order: customPlanOrder })
      });
      await load();
    }

    async function pollRefreshStatus(generation, attempt = 0) {
      if (generation !== refreshPollGeneration || document.hidden) {
        finishRefreshPolling(generation);
        return;
      }
      const accountResult = await refreshAccountsResult(generation);
      if (!accountResult.applied) {
        if (accountResult.reason === "superseded" &&
          activeRefreshPollGeneration === generation &&
          attempt < 59) {
          scheduleRefreshPolling(generation, attempt);
          return;
        }
        finishRefreshPolling(generation);
        return;
      }
      const active = accounts.some(account => ["queued", "refreshing"].includes(account.refresh?.state));
      if (active && attempt < 59) {
        scheduleRefreshPolling(generation, attempt);
        return;
      }
      finishRefreshPolling(generation);
    }

    async function refresh(ids = []) {
      const requestGeneration = ++refreshRequestGeneration;
      try {
        await api("/refresh", { method: "POST", body: JSON.stringify({ ids }) });
      } catch (error) {
        if (requestGeneration < refreshRequestGeneration) return;
        throw error;
      }
      if (requestGeneration < latestSuccessfulRefreshRequest) return;
      latestSuccessfulRefreshRequest = requestGeneration;
      const generation = ++refreshPollGeneration;
      clearTimeout(refreshPollTimer);
      refreshPollTimer = 0;
      clearTimeout(accountPollTimer);
      accountPollTimer = 0;
      activeRefreshPollGeneration = generation;
      $("connectionStatus").textContent = "额度刷新已排队";
      try {
        await pollRefreshStatus(generation);
      } catch (error) {
        finishRefreshPolling(generation);
        throw error;
      }
    }

    function previewCandidateStatus(candidate) {
      if (candidate.in_active_group) return '<span class="pill group">最终组</span>';
      if (candidate.in_active_layer) return '<span class="pill layer">当前层候选</span>';
      if (candidate.eligible) return '<span class="pill waiting">其他层候选</span>';
      const label = reasonLabels[candidate.reason] || candidate.reason_label || candidate.reason || "已排除";
      return `<span class="pill excluded">已排除</span><div class="cell-sub">${escapeHTML(label)}</div>`;
    }

    function renderPreview(preview) {
      const selectedAccount = preview.selected_account || {};
      const selectedLabel = selectedAccount.label || selectedAccount.id || preview.selected_auth || "--";
      const quota = selectedAccount.quota_known ? `${selectedAccount.quota_score}%` : "未知";
      $("previewSelected").innerHTML = `
        <strong>${escapeHTML(selectedLabel)}</strong>
        <span class="pill ${selectedAccount.layer === "backup" ? "backup" : "ready"}">${selectedAccount.layer === "backup" ? "备用层" : "普通层"}</span>
        <span class="status">${escapeHTML(selectedAccount.plan_type || selectedAccount.plan || "unknown")} · 额度分数 ${quota}</span>`;
      $("previewRule").textContent = profileRules[preview.profile] || preview.profile || "";

      const funnel = preview.funnel || {};
      const steps = [
        ["宿主候选", funnel.candidates || 0],
        ["宿主可用", funnel.host_available || 0],
        ["额度合格", funnel.quota_eligible || 0],
        [preview.active_layer === "backup" ? "备用层" : "普通层", funnel.active_layer || 0],
        ["最终策略组", funnel.strategy_group || 0],
        ["预计账号", preview.selected_auth ? 1 : 0]
      ];
      $("previewFunnel").innerHTML = steps.map(([label, value]) => `
        <div class="funnel-step"><span>${escapeHTML(label)}</span><strong>${Number(value)}</strong></div>
      `).join("");

      const exclusions = preview.exclusions || [];
      $("previewExclusions").innerHTML = exclusions.length
        ? exclusions.map(item => `<span class="exclusion-item">${escapeHTML(reasonLabels[item.reason] || item.label || item.reason)} · ${Number(item.count || 0)}</span>`).join("")
        : '<span class="status">没有账号因策略被排除</span>';

      const candidates = preview.candidates || [];
      $("previewCandidates").innerHTML = candidates.length
        ? candidates.map(candidate => {
          const accountLabel = candidate.label || candidate.id;
          const planRank = candidate.plan_known ? `${candidate.plan_rank}` : "未知";
          const quotaScore = candidate.quota_known ? `${candidate.quota_score}%` : "未知";
          const manual = preview.automatic
            ? `${candidate.priority} / ${candidate.weight}<div class="cell-sub">自动模式忽略</div>`
            : `${candidate.priority} / ${candidate.weight}`;
          return `
            <tr class="${candidate.in_active_group ? "active-group" : ""}">
              <td><div class="account-name">${escapeHTML(accountLabel)}</div><div class="account-sub">${escapeHTML(candidate.id)}</div></td>
              <td><span class="pill ${candidate.layer === "backup" ? "backup" : "ready"}">${candidate.layer === "backup" ? "备用" : "普通"}</span></td>
              <td>${escapeHTML(candidate.plan_type || candidate.plan)}<div class="cell-sub">等级 ${planRank}</div></td>
              <td>${quotaScore}</td>
              <td>${manual}</td>
              <td>${previewCandidateStatus(candidate)}</td>
            </tr>`;
        }).join("")
        : '<tr><td colspan="6" class="empty">没有候选账号</td></tr>';
      const scope = preview.scope === "inventory" ? "库存级预估，真实结果请看最近真实调度" : "调度预览";
      $("previewStatus").textContent = `${scope} · 模式：${profileLabels[preview.profile] || preview.profile} · 模型：${preview.model || "未指定"}`;
      $("previewStatus").className = "status success";
    }

    async function runPreview() {
      $("previewStatus").textContent = "正在分析...";
      $("previewStatus").className = "status";
      try {
        const preview = await api("/preview", {
          method: "POST",
          body: JSON.stringify({ model: $("previewModel").value })
        });
        renderPreview(preview);
      } catch (error) {
        $("previewStatus").textContent = error.message;
        $("previewStatus").className = "status error";
      }
    }

    function showError(error) {
      if (error.preserveConnectionStatus) return;
      setConnectionStatus(error.message, "error");
    }

    $("applyButton").onclick = () => applyPending().catch(showError);
    $("applyBatchButton").onclick = batchPatch;
    $("reloadButton").onclick = () => load().catch(showError);
    $("refreshButton").onclick = () => refresh().catch(showError);
    $("refreshSelectedButton").onclick = () => refresh([...selected]).catch(showError);
    $("searchInput").oninput = renderAccounts;
    $("planFilter").onchange = renderAccounts;
    $("stateFilter").onchange = renderAccounts;
    $("customPlanOrder").onchange = () => saveCustomPlanOrder().catch(showError);
    $("selectAll").onchange = event => {
      for (const account of filtered()) {
        event.target.checked ? selected.add(account.id) : selected.delete(account.id);
      }
      renderAccounts();
    };
    $("selectFreeButton").onclick = () => {
      for (const account of filtered().filter(item => item.plan === "free")) selected.add(account.id);
      renderAccounts();
    };
    $("selectPaidButton").onclick = () => {
      for (const account of filtered().filter(item => item.plan === "paid")) selected.add(account.id);
      renderAccounts();
    };
    document.querySelectorAll("[data-profile]").forEach(button => {
      button.onclick = () => setProfile(button.dataset.profile).catch(showError);
    });
    $("clearTemporaryButton").onclick = () => api("/profile", {
      method: "PUT",
      body: JSON.stringify({ clear_temporary: true })
    }).then(load).catch(showError);
    $("previewButton").onclick = () => $("previewDialog").showModal();
    $("closePreviewButton").onclick = () => $("previewDialog").close();
    $("runPreviewButton").onclick = runPreview;
    $("connectButton").onclick = async event => {
      event.preventDefault();
      managementKey = $("keyInput").value;
      sessionStorage.setItem("codexPoolKey", managementKey);
      try {
        const loaded = await load();
        if (!loaded) return;
        $("keyDialog").close();
      } catch (error) {
        alert(error.message);
      }
    };

    document.addEventListener("visibilitychange", () => {
      clearTimeout(accountPollTimer);
      accountPollTimer = 0;
      if (document.hidden || !managementKey) return;
      const generation = activeRefreshPollGeneration;
      if (generation !== 0) {
        return refreshAccounts(generation).catch(showError);
      }
      return refreshAccounts().finally(scheduleAccountPolling);
    });

    if (managementKey) {
      load().catch(() => $("keyDialog").showModal());
    } else {
      $("keyDialog").showModal();
    }
  </script>
</body>
</html>
